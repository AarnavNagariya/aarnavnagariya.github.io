<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300">
  <defs>
    <style>
      .box { fill: #fff; stroke: #333; stroke-width: 2px; }
      .kernel-box { fill: #e1f5fe; stroke: #0277bd; stroke-width: 2px; }
      .user-box { fill: #fff9c4; stroke: #fbc02d; stroke-width: 2px; }
      .text { font-family: sans-serif; font-size: 14px; text-anchor: middle; }
      .title { font-family: sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .arrow { stroke: #333; stroke-width: 1.5px; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Monolithic Kernel -->
  <text x="125" y="30" class="title">Monolithic Kernel</text>
  
  <!-- User Space -->
  <rect x="50" y="50" width="150" height="40" class="user-box" />
  <text x="125" y="75" class="text">Application</text>

  <!-- System Call Arrow -->
  <line x1="125" y1="90" x2="125" y2="120" class="arrow" />
  <text x="160" y="110" font-size="10">System Call</text>

  <!-- Kernel Space -->
  <rect x="50" y="120" width="150" height="100" class="kernel-box" />
  <text x="125" y="140" class="text" font-weight="bold">Kernel</text>
  <text x="125" y="160" class="text" font-size="12">File System</text>
  <text x="125" y="175" class="text" font-size="12">IPC, Memory Mgmt</text>
  <text x="125" y="190" class="text" font-size="12">Device Drivers</text>

  <!-- Hardware Arrow -->
  <line x1="125" y1="220" x2="125" y2="250" class="arrow" />

  <!-- Hardware -->
  <rect x="50" y="250" width="150" height="30" class="box" />
  <text x="125" y="270" class="text">Hardware</text>


  <!-- Microkernel -->
  <text x="375" y="30" class="title">Microkernel</text>

  <!-- User Space -->
  <rect x="300" y="50" width="150" height="90" class="user-box" />
  <text x="375" y="65" class="text" font-weight="bold">User Space</text>
  
  <rect x="310" y="75" width="60" height="25" fill="white" stroke="#333" />
  <text x="340" y="92" font-size="10" text-anchor="middle">App</text>
  
  <rect x="380" y="75" width="60" height="25" fill="white" stroke="#333" />
  <text x="410" y="92" font-size="10" text-anchor="middle">Servers</text>
  <text x="410" y="115" font-size="9" text-anchor="middle">(FS, Drivers)</text>

  <!-- IPC Arrow -->
  <line x1="375" y1="140" x2="375" y2="170" class="arrow" />
  <text x="400" y="160" font-size="10">IPC</text>

  <!-- Kernel Space -->
  <rect x="300" y="170" width="150" height="50" class="kernel-box" />
  <text x="375" y="190" class="text" font-weight="bold">Microkernel</text>
  <text x="375" y="205" class="text" font-size="10">IPC, MM, Scheduling</text>

  <!-- Hardware Arrow -->
  <line x1="375" y1="220" x2="375" y2="250" class="arrow" />

  <!-- Hardware -->
  <rect x="300" y="250" width="150" height="30" class="box" />
  <text x="375" y="270" class="text">Hardware</text>

</svg>
