<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300">
  <defs>
    <style>
      .box { fill: #f9f9f9; stroke: #333; stroke-width: 2px; }
      .os-box { fill: #ff99ff; stroke: #333; stroke-width: 2px; }
      .text { font-family: sans-serif; font-size: 14px; text-anchor: middle; }
      .arrow { stroke: #333; stroke-width: 2px; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- User -->
  <rect x="50" y="20" width="100" height="40" rx="5" class="box" />
  <text x="100" y="45" class="text">User</text>

  <!-- Arrow -->
  <line x1="100" y1="60" x2="100" y2="90" class="arrow" />

  <!-- Application Programs -->
  <rect x="50" y="90" width="100" height="40" rx="5" class="box" />
  <text x="100" y="115" class="text">Application Programs</text>

  <!-- Arrow -->
  <line x1="100" y1="130" x2="100" y2="160" class="arrow" />

  <!-- Operating System -->
  <rect x="50" y="160" width="100" height="40" rx="5" class="os-box" />
  <text x="100" y="185" class="text">Operating System</text>

  <!-- Arrow -->
  <line x1="100" y1="200" x2="100" y2="230" class="arrow" />

  <!-- Computer Hardware -->
  <rect x="50" y="230" width="100" height="40" rx="5" class="box" />
  <text x="100" y="255" class="text">Computer Hardware</text>
</svg>
