<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
  <defs>
    <style>
      .state { fill: #fff; stroke: #333; stroke-width: 2px; rx: 15; ry: 15; }
      .text { font-family: sans-serif; font-size: 14px; text-anchor: middle; font-weight: bold; }
      .label { font-family: sans-serif; font-size: 10px; text-anchor: middle; fill: #555; }
      .arrow { stroke: #333; stroke-width: 1.5px; marker-end: url(#arrowhead); fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- States -->
  <rect x="20" y="80" width="80" height="40" class="state" />
  <text x="60" y="105" class="text">New</text>

  <rect x="150" y="80" width="80" height="40" class="state" />
  <text x="190" y="105" class="text">Ready</text>

  <rect x="300" y="80" width="80" height="40" class="state" />
  <text x="340" y="105" class="text">Running</text>

  <rect x="450" y="80" width="100" height="40" class="state" />
  <text x="500" y="105" class="text">Terminated</text>

  <rect x="225" y="150" width="80" height="40" class="state" />
  <text x="265" y="175" class="text">Waiting</text>

  <!-- Transitions -->
  <!-- New -> Ready -->
  <line x1="100" y1="100" x2="150" y2="100" class="arrow" />
  <text x="125" y="95" class="label">Admitted</text>

  <!-- Ready -> Running -->
  <line x1="230" y1="100" x2="300" y2="100" class="arrow" />
  <text x="265" y="95" class="label">Scheduler Dispatch</text>

  <!-- Running -> Ready (Interrupt) -->
  <path d="M 320 80 Q 265 40 210 80" class="arrow" />
  <text x="265" y="55" class="label">Interrupt / Time Quantum</text>

  <!-- Running -> Terminated -->
  <line x1="380" y1="100" x2="450" y2="100" class="arrow" />
  <text x="415" y="95" class="label">Exit</text>

  <!-- Running -> Waiting -->
  <path d="M 340 120 Q 340 170 305 170" class="arrow" />
  <text x="360" y="150" class="label">I/O Wait</text>

  <!-- Waiting -> Ready -->
  <path d="M 225 170 Q 190 170 190 120" class="arrow" />
  <text x="175" y="150" class="label">I/O Complete</text>

</svg>
