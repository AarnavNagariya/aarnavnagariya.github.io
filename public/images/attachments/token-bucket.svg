<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <style>
    .bucket { fill: none; stroke: #333; stroke-width: 3; }
    .token { fill: #ffcc00; stroke: #cc9900; }
    .text { font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }
    .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Bucket -->
  <path d="M 100 100 L 120 300 L 280 300 L 300 100" class="bucket" />
  
  <!-- Tokens -->
  <circle cx="150" cy="280" r="10" class="token" />
  <circle cx="180" cy="280" r="10" class="token" />
  <circle cx="210" cy="280" r="10" class="token" />
  <circle cx="240" cy="280" r="10" class="token" />
  
  <circle cx="160" cy="250" r="10" class="token" />
  <circle cx="200" cy="250" r="10" class="token" />
  <circle cx="230" cy="250" r="10" class="token" />

  <!-- Refill -->
  <text x="200" y="30" class="text">Refill Rate (r)</text>
  <path d="M 200 40 L 200 90" class="arrow" />
  <circle cx="200" cy="70" r="8" class="token" />

  <!-- Request -->
  <text x="200" y="380" class="text">Request (Needs Token)</text>
  <path d="M 200 310 L 200 360" class="arrow" />
  <circle cx="200" cy="335" r="8" class="token" />

</svg>