<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <style>
    .box { fill: #fff; stroke: #333; stroke-width: 2; rx: 5; }
    .db { fill: #f0f0f0; stroke: #333; stroke-width: 2; }
    .text { font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }
    .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    .sync { stroke: #28a745; stroke-dasharray: 5,5; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- User -->
  <circle cx="300" cy="40" r="20" style="fill:#333" />
  <text x="300" y="80" class="text">User</text>

  <!-- Command Side -->
  <rect x="50" y="150" width="120" height="50" class="box" style="stroke:#d9534f" />
  <text x="110" y="180" class="text">Command API</text>
  <text x="110" y="140" class="text" style="font-size:12px; fill:#d9534f">Write (Create/Update)</text>

  <path d="M 110 200 L 110 250" class="arrow" />
  <path d="M 80 250 L 140 250 L 140 290 L 80 290 Z" class="db" />
  <text x="110" y="275" class="text">Write DB</text>

  <!-- Query Side -->
  <rect x="430" y="150" width="120" height="50" class="box" style="stroke:#0275d8" />
  <text x="490" y="180" class="text">Query API</text>
  <text x="490" y="140" class="text" style="font-size:12px; fill:#0275d8">Read (Select)</text>

  <path d="M 490 200 L 490 250" class="arrow" />
  <path d="M 460 250 L 520 250 L 520 290 L 460 290 Z" class="db" />
  <text x="490" y="275" class="text">Read DB</text>

  <!-- Event Bus -->
  <rect x="200" y="320" width="200" height="40" class="box" style="fill:#eee" />
  <text x="300" y="345" class="text">Event Bus / Queue</text>

  <!-- Connections -->
  <path d="M 280 80 L 110 150" class="arrow" />
  <path d="M 320 80 L 490 150" class="arrow" />

  <path d="M 140 270 L 200 330" class="arrow sync" />
  <path d="M 400 330 L 460 270" class="arrow sync" />
  <text x="300" y="380" class="text" style="font-size:12px">Async Synchronization</text>

</svg>