<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <style>
    .component { fill: #fff; stroke: #333; stroke-width: 2; rx: 5; }
    .actor { fill: #333; }
    .label { font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }
    .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>

  <!-- Users -->
  <circle cx="50" cy="250" r="20" class="actor" />
  <text x="50" y="290" class="label">Users</text>

  <!-- CDN -->
  <rect x="150" y="50" width="100" height="60" class="component" />
  <text x="200" y="85" class="label">CDN</text>

  <!-- Load Balancer -->
  <rect x="150" y="220" width="100" height="60" class="component" style="fill:#e6f3ff" />
  <text x="200" y="255" class="label">Load Balancer</text>

  <!-- App Servers -->
  <rect x="350" y="150" width="100" height="60" class="component" />
  <text x="400" y="185" class="label">App Server 1</text>
  
  <rect x="350" y="220" width="100" height="60" class="component" />
  <text x="400" y="255" class="label">App Server 2</text>
  
  <rect x="350" y="290" width="100" height="60" class="component" />
  <text x="400" y="325" class="label">App Server 3</text>

  <!-- Cache -->
  <rect x="550" y="100" width="100" height="60" class="component" style="fill:#fff0e6" />
  <text x="600" y="135" class="label">Cache (Redis)</text>

  <!-- DB Master -->
  <path d="M 550 250 L 650 250 L 650 300 L 550 300 Z" class="component" style="fill:#e6ffe6" />
  <text x="600" y="280" class="label">DB (Master)</text>

  <!-- DB Slave -->
  <path d="M 550 350 L 650 350 L 650 400 L 550 400 Z" class="component" style="fill:#e6ffe6" />
  <text x="600" y="380" class="label">DB (Slave)</text>

  <!-- Connections -->
  <path d="M 70 250 L 140 250" class="arrow" />
  <path d="M 70 250 L 140 80" class="arrow" style="stroke-dasharray: 5,5" />
  
  <path d="M 260 250 L 340 180" class="arrow" />
  <path d="M 260 250 L 340 250" class="arrow" />
  <path d="M 260 250 L 340 320" class="arrow" />

  <path d="M 460 180 L 540 130" class="arrow" />
  <path d="M 460 250 L 540 275" class="arrow" />
  
  <path d="M 600 310 L 600 340" class="arrow" style="stroke-dasharray: 5,5" />
  <text x="630" y="330" class="label" style="font-size:10px">Replication</text>

</svg>