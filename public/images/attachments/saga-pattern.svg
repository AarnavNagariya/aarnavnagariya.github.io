<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <style>
    .service { fill: #e6f3ff; stroke: #0066cc; stroke-width: 2; rx: 5; }
    .orchestrator { fill: #fff0e6; stroke: #cc6600; stroke-width: 2; rx: 5; }
    .text { font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }
    .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
    .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    .event { stroke: #28a745; stroke-dasharray: 4,4; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Choreography -->
  <text x="200" y="40" class="title">Choreography (Event-Driven)</text>
  
  <rect x="50" y="150" width="80" height="50" class="service" />
  <text x="90" y="180" class="text">Service A</text>

  <rect x="200" y="150" width="80" height="50" class="service" />
  <text x="240" y="180" class="text">Service B</text>

  <rect x="350" y="150" width="80" height="50" class="service" />
  <text x="390" y="180" class="text">Service C</text>

  <path d="M 130 175 L 190 175" class="arrow event" />
  <text x="160" y="165" class="text" style="font-size:10px">Event</text>

  <path d="M 280 175 L 340 175" class="arrow event" />
  <text x="310" y="165" class="text" style="font-size:10px">Event</text>

  <!-- Orchestration -->
  <text x="600" y="40" class="title">Orchestration (Centralized)</text>

  <rect x="560" y="80" width="100" height="50" class="orchestrator" />
  <text x="610" y="110" class="text">Orchestrator</text>

  <rect x="480" y="200" width="80" height="50" class="service" />
  <text x="520" y="230" class="text">Service A</text>

  <rect x="600" y="200" width="80" height="50" class="service" />
  <text x="640" y="230" class="text">Service B</text>

  <rect x="720" y="200" width="80" height="50" class="service" />
  <text x="760" y="230" class="text">Service C</text>

  <!-- Arrows from Orchestrator -->
  <path d="M 580 130 L 520 190" class="arrow" />
  <path d="M 610 130 L 640 190" class="arrow" />
  <path d="M 640 130 L 760 190" class="arrow" />

</svg>