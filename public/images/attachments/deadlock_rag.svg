<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <style>
      .process { fill: #fce4ec; stroke: #c2185b; stroke-width: 2px; rx: 20; ry: 20; }
      .resource { fill: #e0f2f1; stroke: #00695c; stroke-width: 2px; }
      .text { font-family: sans-serif; font-size: 14px; text-anchor: middle; font-weight: bold; }
      .arrow { stroke: #333; stroke-width: 1.5px; marker-end: url(#arrowhead); fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Process 1 -->
  <rect x="20" y="20" width="80" height="40" class="process" />
  <text x="60" y="45" class="text">P1</text>

  <!-- Resource 1 -->
  <rect x="200" y="20" width="60" height="40" class="resource" />
  <text x="230" y="45" class="text">R1</text>
  <circle cx="230" cy="30" r="3" fill="#333" />

  <!-- Process 2 -->
  <rect x="200" y="140" width="80" height="40" class="process" />
  <text x="240" y="165" class="text">P2</text>

  <!-- Resource 2 -->
  <rect x="20" y="140" width="60" height="40" class="resource" />
  <text x="50" y="165" class="text">R2</text>
  <circle cx="50" cy="150" r="3" fill="#333" />

  <!-- Edges -->
  <!-- P1 holds R2 -->
  <line x1="50" y1="140" x2="50" y2="60" class="arrow" />
  <text x="40" y="100" font-size="10" transform="rotate(-90 40,100)">Holds</text>

  <!-- P1 waits for R1 -->
  <line x1="100" y1="40" x2="200" y2="40" class="arrow" />
  <text x="150" y="35" font-size="10">Waits for</text>

  <!-- P2 holds R1 -->
  <line x1="230" y1="60" x2="230" y2="140" class="arrow" />
  <text x="240" y="100" font-size="10" transform="rotate(90 240,100)">Holds</text>

  <!-- P2 waits for R2 -->
  <line x1="200" y1="160" x2="80" y2="160" class="arrow" />
  <text x="140" y="175" font-size="10">Waits for</text>

</svg>
