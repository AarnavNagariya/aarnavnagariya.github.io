<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250">
  <defs>
    <style>
      .box { fill: #fff; stroke: #333; stroke-width: 2px; }
      .tlb-box { fill: #fff3e0; stroke: #ef6c00; stroke-width: 2px; }
      .mem-box { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2px; }
      .text { font-family: sans-serif; font-size: 14px; text-anchor: middle; font-weight: bold; }
      .arrow { stroke: #333; stroke-width: 1.5px; marker-end: url(#arrowhead); fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- CPU -->
  <rect x="20" y="100" width="60" height="40" class="box" />
  <text x="50" y="125" class="text">CPU</text>

  <!-- Logical Address -->
  <line x1="80" y1="120" x2="150" y2="120" class="arrow" />
  <text x="115" y="115" font-size="10">Logical Addr</text>

  <!-- TLB -->
  <rect x="150" y="80" width="80" height="80" class="tlb-box" />
  <text x="190" y="125" class="text">TLB</text>

  <!-- TLB Hit -->
  <line x1="230" y1="100" x2="350" y2="100" class="arrow" />
  <text x="290" y="95" font-size="10" fill="green">TLB Hit</text>

  <!-- TLB Miss -->
  <line x1="190" y1="160" x2="190" y2="200" class="arrow" />
  <text x="200" y="185" font-size="10" fill="red">TLB Miss</text>

  <!-- Page Table -->
  <rect x="150" y="200" width="80" height="40" class="box" />
  <text x="190" y="225" class="text">Page Table</text>

  <!-- Page Table -> Memory -->
  <path d="M 230 220 Q 350 220 350 160" class="arrow" />

  <!-- Physical Memory -->
  <rect x="350" y="50" width="100" height="150" class="mem-box" />
  <text x="400" y="130" class="text">Physical</text>
  <text x="400" y="150" class="text">Memory</text>

</svg>
