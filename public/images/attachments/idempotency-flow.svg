<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600">
  <style>
    .box { fill: #fff; stroke: #333; stroke-width: 2; rx: 5; }
    .decision { fill: #fff; stroke: #333; stroke-width: 2; transform: rotate(45deg); }
    .text { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
    .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Start -->
  <circle cx="250" cy="30" r="20" style="fill:#333" />
  <text x="250" y="35" class="text" style="fill:#fff">Start</text>

  <!-- Check Header -->
  <rect x="175" y="80" width="150" height="40" class="box" />
  <text x="250" y="105" class="text">Check Idempotency Key</text>
  <path d="M 250 50 L 250 80" class="arrow" />

  <!-- Decision: Present? -->
  <path d="M 250 150 L 290 190 L 250 230 L 210 190 Z" class="box" />
  <text x="250" y="195" class="text">Key in DB?</text>
  <path d="M 250 120 L 250 150" class="arrow" />

  <!-- No: Create -->
  <text x="310" y="190" class="text">No</text>
  <path d="M 290 190 L 350 190 L 350 250" class="arrow" />
  <rect x="300" y="250" width="100" height="40" class="box" style="stroke:green" />
  <text x="350" y="275" class="text">Create (Status: CREATED)</text>

  <!-- Process -->
  <path d="M 350 290 L 350 330" class="arrow" />
  <rect x="300" y="330" width="100" height="40" class="box" />
  <text x="350" y="355" class="text">Process Request</text>

  <!-- Update -->
  <path d="M 350 370 L 350 410" class="arrow" />
  <rect x="300" y="410" width="100" height="40" class="box" style="stroke:green" />
  <text x="350" y="435" class="text">Update (Status: CONSUMED)</text>

  <!-- Return 201 -->
  <path d="M 350 450 L 350 490" class="arrow" />
  <rect x="300" y="490" width="100" height="40" class="box" />
  <text x="350" y="515" class="text">Return 201 Created</text>

  <!-- Yes: Check Status -->
  <text x="190" y="190" class="text">Yes</text>
  <path d="M 210 190 L 150 190 L 150 250" class="arrow" />
  <path d="M 150 250 L 190 290 L 150 330 L 110 290 Z" class="box" />
  <text x="150" y="295" class="text">Status?</text>

  <!-- Consumed -->
  <text x="100" y="290" class="text">Consumed</text>
  <path d="M 110 290 L 70 290 L 70 350" class="arrow" />
  <rect x="20" y="350" width="100" height="40" class="box" />
  <text x="70" y="375" class="text">Return 200 OK</text>

  <!-- Created -->
  <text x="200" y="290" class="text">Created</text>
  <path d="M 190 290 L 230 290 L 230 350" class="arrow" />
  <rect x="180" y="350" width="100" height="40" class="box" style="stroke:red" />
  <text x="230" y="375" class="text">Return 409 Conflict</text>

</svg>